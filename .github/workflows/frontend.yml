name: browser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  artwork-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install Python dependencies
        run: python -m pip install -e '.[testing,viewer]'
      - name: Install browser test dependencies
        run: npm install --prefix tests/frontend
      - name: Install Chromium
        run: tests/frontend/node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser tests
        env:
          BROWSER_SCREENSHOTS_DIR: ${{ runner.temp }}/pmxbot-ui-screenshots
        run: node --test tests/frontend/artwork_history.test.cjs
      - name: Save desktop and mobile UI screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: ${{ runner.temp }}/pmxbot-ui-screenshots
          if-no-files-found: ignore
          retention-days: 7
