[metadata]
name = pmxbot
author = YouGov, Plc.
author_email = dev@yougov.com
maintainer = Jason R. Coombs
maintainer_email = jaraco@jaraco.com
description = IRC bot - full featured, yet extensible and customizable
long_description = file:README.rst
url = https://github.com/pmxbot/pmxbot
project_urls =
	Source = https://github.com/godelfin/pmxbot
classifiers =
	Development Status :: 5 - Production/Stable
	Intended Audience :: Developers
	License :: OSI Approved :: MIT License
	Programming Language :: Python :: 3
	Programming Language :: Python :: 3 :: Only
	Topic :: Communications :: Chat :: Internet Relay Chat
	Topic :: Internet :: WWW/HTTP :: WSGI :: Application

[options]
packages = find_namespace:
include_package_data = true
python_requires = >=3.8
install_requires =
	boto3>=1.35
	requests
	pyyaml
	feedparser
	pytz
	beautifulsoup4>=4.14,<5
	wordnik-py3
	more_itertools
	tempora
	jaraco.collections>=3.4
	jaraco.itertools
	jaraco.context
	jaraco.classes
	jaraco.functools
	inflect
	python-dateutil
	# 12.4.0 requires Windows-only wmi even on Linux (fixed in 12.4.1).
	jaraco.mongodb>=7.3.1,!=12.4.0
	importlib_metadata>=3.6
	importlib_resources>=1.3
	# required by pymongo to honor mongodb+srv scheme
	dnspython
	irc>=15.0

[options.packages.find]
exclude =
	build*
	dist*
	docs*
	deploy*
	tests*

[options.extras_require]
testing =
	# upstream
	pytest >= 6
	pytest-cov

	# local
	more_itertools
	jaraco.mongodb
	setuptools_scm
	jaraco.test >= 5.3

quality =
	pytest >= 6
	pytest-checkdocs >= 2.4
	black == 24.8.0
	ruff == 0.16.10
	mypy
	types-requests
	types-python-dateutil
	types-pytz
	types-pyyaml

docs =
	# upstream
	sphinx >= 3.5
	jaraco.packaging >= 9.3
	rst.linker >= 1.9
	furo
	sphinx-lint

	# tidelift
	jaraco.tidelift >= 1.4

	# local

mongodb =
	pymongo>=3

viewer =
	cherrypy>=3.2.3
	jinja2>=2.11.2

slack =
	slack_sdk

[options.entry_points]
console_scripts =
	pmxbot=pmxbot.core:run
	pmxbotweb=pmxbot.web.viewer:run
	pmxbot-generation-worker=pmxbot.jobs:run

pmxbot_handlers =
	pmxbot logging = pmxbot.logging:Logger.initialize
	pmxbot karma = pmxbot.karma:Karma.initialize
	pmxbot quotes = pmxbot.quotes:Quotes.initialize
	pmxbot core commands = pmxbot.commands
	pmxbot notifier = pmxbot.notify:Notify.init
	pmxbot stack = pmxbot.stack:Stack.init
	pmxbot rolls = pmxbot.rolls:ParticipantLogger.initialize
	pmxbot config = pmxbot.config_
	pmxbot system commands = pmxbot.system

pytest11 =
	pmxbot core = pmxbot.testing.fixtures
