[testenv]
deps =
	pytest @ git+https://github.com/jaraco/pytest@pmxbot-108
setenv =
	PYTHONWARNDEFAULTENCODING = 1
commands =
	python -m pytest {posargs} --cov
passenv=
	MONGODB_HOME
	GOOGLE_API_KEY
	# jaraco.mongodb uses this to allow slower Windows/macOS startup in CI.
	GITHUB_ACTIONS
usedevelop = True
extras =
    testing
    mongodb
    viewer

[testenv:quality]
ignore_errors = True
extras =
    quality
    testing
    mongodb
    viewer
commands =
    python -m black --check .
    # Ruff is temporarily disabled while existing lint violations are addressed.
    # python -m ruff check .
    # python -m ruff format --check .
    python -m mypy .
    python -m pytest -o addopts= -p no:enabler -p no:black -p no:mypy -p no:ruff -p no:cov -p checkdocs setup.cfg

[testenv:integration]
commands =
    python -m pytest tests/integration -m integration {posargs}

[testenv:docs]
extras =
	docs
	testing
changedir = docs
commands =
	python -m sphinx -W --keep-going . {toxinidir}/build/html
	python -m sphinxlint

[testenv:finalize]
skip_install = True
deps =
	towncrier
	jaraco.develop >= 7.23
passenv = *
commands =
	python -m jaraco.develop.finalize


[testenv:release]
skip_install = True
deps =
	build
	twine>=3
	jaraco.develop>=7.1
passenv =
	TWINE_PASSWORD
	GITHUB_TOKEN
setenv =
	TWINE_USERNAME = {env:TWINE_USERNAME:__token__}
commands =
	python -c "import shutil; shutil.rmtree('dist', ignore_errors=True)"
	python -m build
	python -m twine upload dist/*
	python -m jaraco.develop.create-github-release
