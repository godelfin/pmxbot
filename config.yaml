server_host: "irc.freenode.net"
server_port: 6667
bot_nickname: pmxbot
log_channels:
    - "#pmxbot"
other_channels:
    - "#pmxbot2"
inane_channel: "#pmxbot"
# database should be something like a MongoDB URI (mongodb://localhost)
#  or sqlite URI (sqlite:path/filename)
database: sqlite:pmxbot.sqlite
places: ["Palo Alto, CA", "Canton, OH", "Washington, DC", "London, England"]
lunch_choices:
    PA: ["Pasta?", "Thaiphoon", "Pluto's", "Penninsula Creamery", "Kan Zeman"]
feed_interval: 15 #minutes
feeds:
    - name    : "pmxbot bitbucket"
      channel : "#botone"
      linkurl : "http://bitbucket.org/yougov/pmxbot"
      url     : "http://bitbucket.org/yougov/pmxbot"
    - name    : "pmxbot on twitter"
      channel : "#bottwo"
      linkurl : "http://search.twitter.com/search?q=pmxbot"
      url     : "http://search.twitter.com/search.atom?q=pmxbot"
librarypaste: http://a.libpa.st/

web_base: /
web_port: 8080
web_host: 0.0.0.0
#logo: /pmxbot.png

# ping the server every 30 seconds to recover from dropped connections
TCP keepalive: 30 seconds

# set a rate limit on outgoing messages in messages per second
message rate limit: 2.5

# Optional command-to-library mapping, applied when the bot starts.
# !quote and !q always use the pmx library.
# quote_libraries:
#     album: album
#     band: band
#     tunes: song
#     robjob: robjob
#     food: food
#     tagline: tagline

# Secret keywords; unset variables leave Silent Mode off.
silent_mode_disable_command: !env SILENT_MODE_DISABLE_CMD
silent_mode_enable_command: !env SILENT_MODE_ENABLE_CMD

# !image <prompt> (alias !imagine): OpenAI generation and Cloudflare R2 hosting.
images_enabled: false
openai_api_key: !env OPENAI_API_KEY
# R2 S3 endpoint, e.g. https://<ACCOUNT_ID>.r2.cloudflarestorage.com
r2_endpoint_url: !env R2_ENDPOINT_URL
r2_access_key_id: !env R2_ACCESS_KEY_ID
r2_secret_access_key: !env R2_SECRET_ACCESS_KEY
r2_bucket: !env R2_BUCKET
# Public bucket custom domain (or r2.dev URL for development), not the S3 endpoint.
r2_public_url: !env R2_PUBLIC_URL
images_directory: images
# Image cache metadata uses the main SQLite database configured above.
images_model: gpt-image-1
images_size: 1024x1024
images_quality: low
