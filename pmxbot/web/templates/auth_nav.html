<header class="site-header">
{% include "site_logo.html" %}
<style>
.site-header { display: flex; flex-wrap: wrap; align-items: center; max-width: 70rem; margin: auto; padding: .5rem .75rem; gap: .5rem 1rem; overflow-wrap: anywhere; }
.site-header .site-brand { margin: 0; padding: 0; }
.site-header .account-nav { margin: 0; padding: .25rem 0; gap: 1rem; }
.account-nav { max-width: 70rem; margin: 0 auto; padding: .75rem 1.25rem; display: flex; justify-content: flex-start; align-items: baseline; flex-wrap: wrap; gap: .5rem; }
.account-nav form { margin: 0; }
.account-nav a, .account-nav button { padding: 0; border: 0; background: none; color: #135ba1; font: inherit; text-decoration: underline; cursor: pointer; }
.site-header a:focus-visible, .site-header button:focus-visible { outline: 3px solid #135ba1; outline-offset: 4px; }
</style>
<nav class="account-nav" aria-label="Site navigation">
<a href="{{ base|e }}/">Browse albums</a>
{% if current_user %}
{% if current_user.is_admin %}<a href="{{ base|e }}/admin/users">Administration → Users</a>
<a href="{{ base|e }}/admin/tendies">Administration → Tendies</a>{% endif %}
<a href="{{ base|e }}/change_password">Change password</a>
<span>Hi, {{ current_user.username|e }}.</span>
<form action="{{ base|e }}/logout" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token|e }}" />
<a href="{{ base|e }}/logout" hidden>Sign out</a>
<button type="submit">Sign out</button>
</form>
<form class="torta-mode" action="{{ base|e }}/torta_mode" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token|e }}" />
<input type="hidden" name="return_to" value="{{ (base ~ request.path_info ~ ('?' ~ request.query_string if request.query_string else ''))|e }}" />
<label><input type="checkbox" name="enabled" value="1"{% if current_user.nsfw %} checked{% endif %} /> Torta Mode</label>
<button type="submit">Save Torta Mode</button>
</form>
{% else %}
<a href="{{ base|e }}/login?return_to={{ (base ~ request.path_info ~ ('?' ~ request.query_string if request.query_string else ''))|urlencode }}">Sign in</a>
{% endif %}
</nav>
</header>
{% if current_user %}
<script>
(function () {
    const header = document.currentScript.previousElementSibling;
    const form = header.querySelector('form[action$="/logout"]');
    const link = form.querySelector('a');
    link.addEventListener('click', function (event) {
        event.preventDefault();
        form.requestSubmit();
    });
    link.hidden = false;
    form.querySelector('button').hidden = true;
    const mode = header.querySelector('.torta-mode');
    mode.querySelector('input[type=checkbox]').addEventListener('change', () => mode.requestSubmit());
    mode.querySelector('button').hidden = true;
})();
</script>
{% endif %}
