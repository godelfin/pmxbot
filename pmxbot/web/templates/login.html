<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Sign in</title></head>
<body>
{% include "auth_nav.html" %}
<main>
<h1>Sign in</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<form action="{{ base }}/login" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
<input type="hidden" name="return_to" value="{{ return_to }}" />
<p><label>Username <input name="username" autocomplete="username" maxlength="64" required /></label></p>
<p><label>Password <input type="password" name="password" autocomplete="current-password" maxlength="1024" required /></label></p>
<button type="submit">Sign in</button>
</form>
<p><a href="{{ base }}/">Browse albums</a></p>
</main>
</body>
</html>
